<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>POINT FOCAL - Connexion</title>

    <style>
.logo {
    display: block;
    width: 90px;
    height: 90px;
    object-fit: cover;
    border-radius: 16px;
    margin: 0 auto 20px;
}
        * {
            box-sizing: border-box;
        }

        body {
            background: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        h2 {
            color: #ffcc00;
            text-align: center;
            margin-top: 0;
            margin-bottom: 22px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #0d0d0d;
            border: 1px solid #333333;
            border-radius: 4px;
            color: #ffffff;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #ffcc00;
        }

        .password-wrapper {
            position: relative;
            margin-top: 10px;
        }

        .password-wrapper input {
            margin-top: 0;
            padding-right: 48px;
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 4px;
            transform: translateY(-50%);
            width: 42px;
            height: 42px;
            margin: 0;
            padding: 0;
            background: transparent;
            border: none;
            color: #aaaaaa;
            font-size: 20px;
            cursor: pointer;
        }

        .password-toggle:focus {
            outline: 2px solid #ffcc00;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #ffcc00;
            border: none;
            border-radius: 4px;
            color: #121212;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .box {
            display: none;
            margin-top: 15px;
            padding: 11px;
            border-radius: 4px;
            font-size: 14px;
            line-height: 1.4;
        }

        #error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.35);
        }

        #success {
            color: #5ee07a;
            background: rgba(94, 224, 122, 0.1);
            border: 1px solid rgba(94, 224, 122, 0.35);
        }

        .link {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            color: #aaaaaa;
        }

        .link span {
            color: #ffcc00;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>
✋<div class="container">

    <img
        src="logo.jpg"
        alt="Point Focal"
        class="logo"
    >

    <h2>Connexion Point Focal</h2>

    <form id="loginForm">
        <input
            id="email"
            type="email"
            placeholder="Email"
            autocomplete="username"
            required
        >

        <div class="password-wrapper">
            <input
                id="password"
                type="password"
                placeholder="Mot de passe"
                autocomplete="current-password"
                required
            >
            <button
                id="togglePassword"
                class="password-toggle"
                type="button"
                aria-label="Afficher le mot de passe"
                aria-pressed="false"
            >👁</button>
        </div>

        <button id="loginBtn" type="submit">
            Se connecter
        </button>

        <div class="link">
            <span id="forgotPasswordLink" style="cursor:pointer; color:#ffcc00;">
                Mot de passe oublié ?
            </span>
        </div>

        <div id="forgotPasswordBox" style="display:none;">
            <input
                id="forgotEmail"
                type="email"
                placeholder="Adresse e-mail du compte"
                autocomplete="email"
            >

            <button id="forgotPasswordBtn" type="button">
                Envoyer le lien de réinitialisation
            </button>
        </div>

        <div id="error" class="box"></div>
        <div id="success" class="box"></div>
    </form>

    <div class="link">
        Pas de compte ?
        <span onclick="goRegister()">Inscrivez-vous</span>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

        togglePassword?.addEventListener("click", () => {
            const isHidden = passwordInput.type === "password";

            passwordInput.type = isHidden ? "text" : "password";
            togglePassword.textContent = isHidden ? "🙈" : "👁";
            togglePassword.setAttribute(
                "aria-label",
                isHidden ? "Masquer le mot de passe" : "Afficher le mot de passe"
            );
            togglePassword.setAttribute(
                "aria-pressed",
                String(isHidden)
            );
        });
    });


    const forgotPasswordLink =
        document.getElementById("forgotPasswordLink");
    const forgotPasswordBox =
        document.getElementById("forgotPasswordBox");
    const forgotEmail =
        document.getElementById("forgotEmail");
    const forgotPasswordBtn =
        document.getElementById("forgotPasswordBtn");

    forgotPasswordLink?.addEventListener("click", () => {
        const email = document.getElementById("email").value.trim();

        forgotPasswordBox.style.display =
            forgotPasswordBox.style.display === "none"
                ? "block"
                : "none";

        if (forgotPasswordBox.style.display === "block") {
            if (email) {
                forgotEmail.value = email;
            }
            forgotEmail.focus();
        }
    });

    forgotPasswordBtn?.addEventListener("click", async () => {
        const email = forgotEmail.value.trim();

        if (!email) {
            showError("Veuillez saisir votre adresse e-mail.");
            return;
        }

        forgotPasswordBtn.disabled = true;
        forgotPasswordBtn.textContent = "Envoi en cours...";

        try {
            const response = await fetch(
                "https://point-focal.onrender.com/api/auth/forgot-password",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email })
                }
            );

            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                showError(
                    data.message ||
                    data.error ||
                    "Impossible d'envoyer le lien de réinitialisation."
                );
                return;
            }

            showSuccess(
                data.message ||
                "Un lien de réinitialisation a été envoyé à votre adresse e-mail."
            );

            forgotEmail.value = "";
        } catch (error) {
            console.error("Erreur mot de passe oublié :", error);
            showError(
                "Erreur réseau. Attendez quelques secondes puis réessayez."
            );
        } finally {
            forgotPasswordBtn.disabled = false;
            forgotPasswordBtn.textContent =
                "Envoyer le lien de réinitialisation";
        }
    });

    const BASE_API_URL = "https://point-focal.onrender.com/api";

    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const errorBox = document.getElementById("error");
    const successBox = document.getElementById("success");

    function showError(message) {
        successBox.style.display = "none";
        successBox.textContent = "";

        errorBox.textContent = message;
        errorBox.style.display = "block";
    }

    function showSuccess(message) {
        errorBox.style.display = "none";
        errorBox.textContent = "";

        successBox.textContent = message;
        successBox.style.display = "block";
    }

    function clearMessages() {
        errorBox.style.display = "none";
        successBox.style.display = "none";

        errorBox.textContent = "";
        successBox.textContent = "";
    }

    function setLoading(isLoading) {
        loginBtn.disabled = isLoading;
        loginBtn.textContent = isLoading
            ? "Connexion..."
            : "Se connecter";
    }

    async function readJsonSafely(response) {
        try {
            return await response.json();
        } catch (error) {
            return null;
        }
    }

    function getUserFromResponse(data) {
        return data?.user
            || data?.data?.user
            || data?.data
            || null;
    }

    function userHasPointFocalLink(user) {
        if (!user) {
            return false;
        }

        const linkIsActive =
            user.linkActive === true
            || user.link_active === true
            || user.linkActive === 1
            || user.link_active === 1
            || String(user.linkActive).toLowerCase() === "true"
            || String(user.link_active).toLowerCase() === "true";

        const invitationCode =
            user.invitationCode
            || user.invitation_code
            || "";

        return Boolean(
            linkIsActive
            && String(invitationCode).trim()
        );
    }

    function videoIsCompleted(videoResult) {
        const session =
            videoResult?.data
            || videoResult?.session
            || videoResult;

        return (
            session?.isCompleted === true
            || session?.is_completed === true
            || session?.completed === true
            || Number(session?.watchedSeconds) >= 200
            || Number(session?.watched_seconds) >= 200
        );
    }

    async function fetchCurrentUser(token, fallbackUser) {
        try {
            const response = await fetch(
                `${BASE_API_URL}/auth/me`,
                {
                    method: "GET",
                    headers: {
                        Authorization: `Bearer ${token}`,
                        Accept: "application/json"
                    }
                }
            );

            if (!response.ok) {
                console.error(
                    "Impossible de récupérer /auth/me :",
                    response.status,
                    await response.text()
                );

                return fallbackUser;
            }

            const data = await readJsonSafely(response);
            const currentUser = getUserFromResponse(data);

            return currentUser || fallbackUser;
        } catch (error) {
            console.error(
                "Erreur pendant la récupération du profil :",
                error
            );

            return fallbackUser;
        }
    }

    async function redirectUser(token, loginUser) {
    /*
     * Parcours obligatoire :
     * 1. Lien Point Focal actif : dashboard.html
     *    => aucun popup, aucune vidéo.
     * 2. Pas de lien actif :
     *    - vidéo terminée : provision.html
     *    - vidéo non terminée : popup-youtube.html
     */
    const currentUser = await fetchCurrentUser(token, loginUser);
    localStorage.setItem("user", JSON.stringify(currentUser));

    const hasActivePointFocalLink = userHasPointFocalLink(currentUser);

    const isLeader = currentUser?.isLeader === true || currentUser?.is_leader === true;

    if (isLeader) {
        window.location.replace("dashboard.html");
        return;
    }

    if (hasActivePointFocalLink) {
        window.location.replace("dashboard.html");
        return;
    }

    try {
        const videoResponse = await fetch(`${BASE_API_URL}/video/session`, {
            method: "GET",
            headers: {
                Authorization: `Bearer ${token}`,
                Accept: "application/json"
            }
        });

        if (!videoResponse.ok) {
            console.error(
                "Erreur de vérification vidéo :",
                videoResponse.status,
                await videoResponse.text()
            );
            window.location.replace("popup-youtube.html");
            return;
        }

        const videoResult = await readJsonSafely(videoResponse);

        if (videoIsCompleted(videoResult)) {
            window.location.replace("provision.html");
            return;
        }

        window.location.replace("popup-youtube.html");
    } catch (error) {
        console.error("Erreur de redirection :", error);
        window.location.replace("popup-youtube.html");
    }
}

loginForm.addEventListener(
        "submit",
        async function (event) {
            event.preventDefault();

            clearMessages();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showError(
                    "Email et mot de passe obligatoires."
                );
                return;
            }

            setLoading(true);

            try {
                localStorage.removeItem("token");
                localStorage.removeItem("user");

                const response = await fetch(
                    `${BASE_API_URL}/auth/login`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            Accept: "application/json"
                        },
                        body: JSON.stringify({
                            email,
                            password
                        })
                    }
                );

                const data = await readJsonSafely(response);

                if (!response.ok) {
                    const errorMessage =
                        data?.message
                        || data?.error
                        || "Email ou mot de passe incorrect.";

                    if (
                        errorMessage.toLowerCase().includes("confirmer") &&
                        errorMessage.toLowerCase().includes("otp")
                    ) {
                        localStorage.setItem("pendingEmail", email);
                        window.location.href = "confirm-otp.html";
                        return;
                    }

                    showError(errorMessage);
                    return;
                }

                const token =
                    data?.token
                    || data?.data?.token;

                const user =
                    data?.user
                    || data?.data?.user;

                if (!token || !user) {
                    console.error(
                        "Réponse complète reçue :",
                        data
                    );

                    showError(
                        "Réponse de connexion invalide."
                    );
                    return;
                }

                localStorage.setItem("token", token);
                localStorage.setItem(
                    "user",
                    JSON.stringify(user)
                );

                showSuccess(
                    "Connexion réussie. Vérification de votre parcours..."
                );

                await redirectUser(token, user);
            } catch (error) {
                console.error(
                    "Erreur de connexion :",
                    error
                );

                showError(
                    "Erreur réseau : " + error.message
                );
            } finally {
                setLoading(false);
            }
        }
    );

    function goRegister() {
        window.location.href = "register.html";
    }
</script>

</body>
</html>
