<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B0E11">
  <title>POINT FOCAL — Hors connexion</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0B0E11; color: #EAECEF; font: 16px/1.6 Arial,sans-serif; }
    main { width: min(100%, 520px); padding: 28px; border: 1px solid #2B3139; border-radius: 12px; background: #1E2329; text-align: center; }
    h1 { color: #F0B90B; font-size: 1.5rem; }
    p { color: #B7BDC6; }
    button { min-height: 44px; margin-top: 12px; padding: 10px 18px; border: 0; border-radius: 6px; background: #F0B90B; color: #0B0E11; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Vous êtes hors connexion</h1>
    <p id="message">Reconnectez-vous à Internet puis réessayez. Aucune validation métier ne peut être effectuée hors ligne.</p>
    <button id="retry" type="button">Réessayer</button>
  </main>
  <script>
    const copy = {
      fr: ["Vous êtes hors connexion", "Reconnectez-vous à Internet puis réessayez. Aucune validation métier ne peut être effectuée hors ligne.", "Réessayer"],
      en: ["You are offline", "Reconnect to the Internet and try again. Business validations cannot be performed offline.", "Try again"],
      es: ["Estás sin conexión", "Conéctate a Internet e inténtalo de nuevo. Las validaciones requieren conexión.", "Reintentar"],
      pt: ["Você está sem conexão", "Conecte-se à Internet e tente novamente. Validações exigem conexão.", "Tentar novamente"],
      ar: ["أنت غير متصل", "اتصل بالإنترنت ثم أعد المحاولة. لا يمكن إجراء التحققات دون اتصال.", "أعد المحاولة"],
      hi: ["आप ऑफ़लाइन हैं", "इंटरनेट से जुड़ें और फिर कोशिश करें। ऑफ़लाइन सत्यापन नहीं हो सकते।", "फिर से कोशिश करें"]
    };
    const lang = (navigator.language || "fr").slice(0, 2).toLowerCase();
    const value = copy[lang] || copy.fr;
    document.documentElement.lang = copy[lang] ? lang : "fr";
    document.getElementById("title").textContent = value[0];
    document.getElementById("message").textContent = value[1];
    document.getElementById("retry").textContent = value[2];
    document.getElementById("retry").addEventListener("click", () => location.reload());
  </script>
</body>
</html>
