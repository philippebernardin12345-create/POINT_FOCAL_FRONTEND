<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmation OTP - Point Focal</title>

  <style>
    body {
      background: #0b0e11;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .box {
      background: #1e2329;
      padding: 30px;
      border-radius: 14px;
      max-width: 420px;
      width: 100%;
    }

    input,
    button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border-radius: 8px;
      font-size: 16px;
    }

    input {
      background: #2b3139;
      color: white;
      border: 1px solid #444;
    }

    button {
      background: #f0b90b;
      color: #000;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .secondary {
      background: transparent;
      color: #f0b90b;
      border: 1px solid #f0b90b;
    }

    .msg {
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <div class="box">
    <h2>Confirmer votre e-mail</h2>

    <p>
      Entrez le code OTP reçu par e-mail.
    </p>

    <input
      type="email"
      id="email"
      placeholder="Votre e-mail"
      autocomplete="email"
    >

    <input
      type="text"
      id="otp"
      placeholder="Code OTP à 6 chiffres"
      maxlength="6"
      inputmode="numeric"
      autocomplete="one-time-code"
    >

    <button id="confirmBtn" type="button" onclick="confirmOtp()">
      Confirmer
    </button>

    <button
      id="resendBtn"
      type="button"
      class="secondary"
      onclick="resendOtp()"
    >
      Renvoyer le code OTP
    </button>

    <div id="msg" class="msg"></div>
  </div>

  <script>
    const BASE_API =
      "https://point-focal.onrender.com/api/auth";

    const emailInput =
      document.getElementById("email");

    const otpInput =
      document.getElementById("otp");

    const msg =
      document.getElementById("msg");

    const confirmBtn =
      document.getElementById("confirmBtn");

    const resendBtn =
      document.getElementById("resendBtn");

    emailInput.value =
      localStorage.getItem("pendingEmail") || "";

    function showMessage(message, success = false) {
      msg.innerText = message;
      msg.style.color =
        success ? "#0ecb81" : "#f6465d";
    }

    async function confirmOtp() {
      const email =
        emailInput.value.trim().toLowerCase();

      const otp =
        otpInput.value.trim();

      if (!email || !otp) {
        showMessage(
          "Email et code OTP obligatoires."
        );
        return;
      }

      confirmBtn.disabled = true;

      try {
        const res = await fetch(
          `${BASE_API}/confirm-otp`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              email,
              otp
            })
          }
        );

        const data =
          await res.json().catch(() => ({}));

        if (!res.ok) {
          showMessage(
            data.message ||
            "Code OTP invalide ou expiré."
          );
          return;
        }

        localStorage.removeItem("pendingEmail");

        showMessage(
          "E-mail confirmé avec succès. Redirection vers la connexion...",
          true
        );

        setTimeout(() => {
          window.location.href = "login.html";
        }, 1500);

      } catch (error) {
        console.error(
          "Erreur confirmation OTP :",
          error
        );

        showMessage(
          "Erreur réseau. Réessayez."
        );

      } finally {
        confirmBtn.disabled = false;
      }
    }

    async function resendOtp() {
      const email =
        emailInput.value.trim().toLowerCase();

      if (!email) {
        showMessage(
          "Saisissez votre adresse e-mail."
        );
        return;
      }

      resendBtn.disabled = true;
      resendBtn.innerText = "Envoi en cours...";

      try {
        const res = await fetch(
          `${BASE_API}/resend-otp`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              email
            })
          }
        );

        const data =
          await res.json().catch(() => ({}));

        if (!res.ok) {
          showMessage(
            data.message ||
            "Impossible de renvoyer le code OTP."
          );
          return;
        }

        localStorage.setItem(
          "pendingEmail",
          email
        );

        showMessage(
          data.message ||
          "Un nouveau code OTP a été envoyé à votre e-mail.",
          true
        );

      } catch (error) {
        console.error(
          "Erreur renvoi OTP :",
          error
        );

        showMessage(
          "Erreur réseau. Réessayez."
        );

      } finally {
        resendBtn.disabled = false;
        resendBtn.innerText =
          "Renvoyer le code OTP";
      }
    }
  </script>
</body>
</html>
