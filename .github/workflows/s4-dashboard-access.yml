name: S4 Dashboard Access Tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/s4-prelaunch-dashboard-access

permissions:
  contents: read

jobs:
  access-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test S4 dashboard access policy
        run: node --test tests/s4-prelaunch-access.test.js tests/pwa-installability.test.js tests/youtube-return-popup.test.js
